[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urlish"
version = "0.1.0"
description = "Client-side malicious URL detection, and the evaluation that shows why most published versions fail"
requires-python = ">=3.12"
# Pinned: the report's numbers are deterministic and depend on these versions.
dependencies = [
    "numpy==2.5.2",
    "scikit-learn==1.9.1",
]

[project.scripts]
urlish = "urlish.cli:main"
urlish-benchmark = "urlish.benchmark:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urlish"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
